name: Android APK Build

on:
  push:
    branches:
      - master
      - main
      - 'claude/**'
  workflow_dispatch: # allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      # 1 — Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2 — Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3 — Setup JDK 17 (required by React Native 0.81)
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4 — Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5 — Install dependencies
      - name: Install npm dependencies
        working-directory: mobile
        run: npm install

      # 6 — Generate native android/ folder from Expo config
      - name: Expo prebuild (generate android/)
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      # 7 — Write keystore from GitHub secret (only if secret is set)
      - name: Write release keystore
        if: env.KEYSTORE_BASE64 != ''
        working-directory: mobile/android/app
        run: echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      # 8 — Build release APK (signed) or debug APK (no keystore needed)
      - name: Build APK
        working-directory: mobile/android
        run: |
          if [ -f "app/release.keystore" ]; then
            echo "Building signed RELEASE APK"
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            echo "No keystore found — building DEBUG APK"
            ./gradlew assembleDebug
          fi

      # 9 — Upload APK as downloadable artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pathwayhq-apk
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30

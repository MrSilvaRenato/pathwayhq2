name: Android APK Build

on:
  push:
    branches:
      - master
      - main
      - 'claude/**'
  workflow_dispatch: # allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      # 1 — Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2 — Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3 — Setup JDK 17 (required by React Native 0.81)
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4 — Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5 — Cache node_modules
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: mobile/node_modules
          key: node-modules-${{ hashFiles('mobile/package.json') }}
          restore-keys: node-modules-

      # 6 — Cache Gradle files
      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-wrapper-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-caches-${{ hashFiles('mobile/android/**/*.gradle', 'mobile/android/**/*.gradle.kts') }}
          restore-keys: gradle-caches-

      # 7 — Install dependencies
      - name: Install npm dependencies
        working-directory: mobile
        run: npm install

      # 8 — Generate native android/ folder from Expo config
      - name: Expo prebuild (generate android/)
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      # 9 — Write keystore from GitHub secret (only if secret is set)
      - name: Write release keystore
        if: env.KEYSTORE_BASE64 != ''
        working-directory: mobile/android/app
        run: echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      # 10 — Generate debug keystore when no custom keystore is provided
      - name: Generate debug keystore (fallback signing)
        if: env.KEYSTORE_BASE64 == ''
        run: |
          mkdir -p $HOME/.android
          keytool -genkey -v \
            -keystore $HOME/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # 11 — Build APK (always release so JS bundle is included in the APK)
      - name: Build APK
        working-directory: mobile/android
        run: |
          if [ -f "app/release.keystore" ]; then
            echo "Building signed RELEASE APK"
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            echo "No custom keystore — building RELEASE APK signed with debug key"
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.password=android
          fi

      # 12 — Upload APK as downloadable artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pathwayhq-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 30
